:root{color-scheme:light dark;--bg:light-dark(#f6f5f2,#121619);--card:light-dark(#fff,#1b2126);--ink:light-dark(#1e2629,#eef0f1);--ink2:light-dark(#4a5058,#b8bec5);--line:light-dark(#e3e5e8,#2c343b);--acc:#fc6320;--accd:light-dark(#c9470d,#ff8a50);--dk:#1e2629;--soft:light-dark(#fff1e8,#2a1d15)}

*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Inter,sans-serif;line-height:1.05;margin:0}

p{margin:0 0 12px}
a{color:var(--accd)}
header{background:var(--dk);color:#fff;position:relative}

nav{display:flex;gap:6px;flex-wrap:wrap;max-width:1320px;margin:0 auto;padding:14px max(4vw,16px) 0}
nav button{font:700 19px "Barlow Condensed";letter-spacing:.02em;background:var(--card);color:var(--ink);border:1px solid var(--line);border-bottom:0;padding:10px 18px;border-radius:10px 10px 0 0;cursor:pointer;min-height:44px}
nav button.on{background:var(--acc);color:#1e2629;border-color:var(--acc)}
.wrap{max-width:1320px;margin:0 auto;padding:0 max(4vw,16px) 60px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
@media(max-width:1000px){.wrap{grid-template-columns:minmax(0,1fr)}}
main{background:var(--card);border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:clamp(18px,3vw,36px)}
.lead{color:var(--ink2);max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.box{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--bg)}

.sw{height:64px;border-radius:8px;margin-bottom:10px;border:1px solid var(--line)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:15px;margin:6px 0 18px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 16px "Barlow Condensed";letter-spacing:.02em}
.tag{display:inline-block;font:700 13px Inter;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--accd)}
.reels{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.reel{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.reel video,.reel img{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;display:block}
.reel img.sq{aspect-ratio:4/5}
.reel .in{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}

.btn{font:700 15px Inter;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 14px;border-radius:8px;border:0;cursor:pointer;background:var(--acc);color:#1e2629;text-decoration:none}

.today{background:var(--dk);color:#fff;border-radius:10px;padding:14px;margin:8px 0 14px}

.it.ok span{text-decoration:line-through;color:var(--ink2)}
textarea,input[type=text]{width:100%;font:16px Inter;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink)}
textarea{min-height:60px;resize:vertical;margin-top:6px}
.addrow{display:flex;gap:6px;margin-top:6px}.addrow .btn{min-height:40px;padding:6px 12px}
.st{font-size:13px;color:var(--ink2);margin-top:6px}
.week{margin-bottom:18px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.k .box b{font:800 30px "Barlow Condensed";color:var(--accd)}
.pro{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:var(--bg)}
.pro.ok{opacity:.6}.pro.ok b.pt{text-decoration:line-through}
.pro .ph{display:flex;gap:12px;align-items:flex-start}

.pro b.pt{font:700 20px "Barlow Condensed";display:block}
.pro .meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.pro ol{margin:6px 0 0;padding-left:20px;font-size:15px}
.pro p{font-size:15px;margin:4px 0 0;color:var(--ink2)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 18px}.bar i{display:block;height:100%;background:var(--acc)}
.fotos{background:var(--soft);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:14px}.fotos b{display:block;color:var(--accd);font-size:14px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;font-weight:600}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.tabp{animation:f .25s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}}}
.presu{margin-left:auto;background:#fc6320;color:#1e2629;font:700 15px Archivo,sans-serif;text-decoration:none;padding:10px 16px;border-radius:8px;white-space:nowrap}
.presu:hover{background:#ff7a3d}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script></head>

 ['google','Google Business · Descripción',`Muñoz Construcción en Seco es una empresa de Junín con más de 15 años de trayectoria en construcción en seco. Ofrecemos materiales y mano de obra para obras completas o por etapas: steel frame, tabiques y cielorrasos de placa de yeso, revestimientos de PVC y terminaciones. Trabajamos con marcas líderes como Knauf, Barbieri y Anclaflex, y asesoramos a cada cliente para elegir la solución adecuada y calcular los materiales necesarios. Entregamos en obra con vehículo propio y respaldamos nuestros trabajos con garantía de 3 meses. Atendemos a particulares, colocadores, estudios de arquitectura y empresas en Junín y la zona. A fines de diciembre nos mudamos a nuestro local propio en Ángela Di Natale de Fulgenzi 56, esquina Francia.`],

return `<h2>Para crecer y verse más profesionales</h2><p class="lead">Lo que todavía no hicimos y suma imagen de empresa. Está ordenado por etapa; tildá cada punto cuando esté hecho. Donde dice "Lo armo yo", pedímelo y te lo paso listo.</p>

${PRO.map(([et,items])=>`<h3>${esc(et)}</h3>${items.map(([id,t,por,pasos,costo,quien,yo])=>`<div class="pro ${PS[id]?'ok':''}"><label class="ph"><input type="checkbox" data-pro="${id}" ${PS[id]?'checked':''}><span><b class="pt">${esc(t)}</b><p>${esc(por)}</p></span></label><div class="meta"><span class="tag">Costo: ${esc(costo)}</span><span class="tag">Quién: ${esc(quien)}</span><span class="tag">Lo armo yo: ${esc(yo)}</span></div><ol>${pasos.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`).join('')}`).join('')}`};

/* ---------- PESTAÑAS ---------- */
async function bajarTxt(nombre,texto){const fn=nombre.replace(/[\\/:*?"<>|·]/g,'').replace(/\s+/g,' ').trim()+'.txt';try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:fn,data:new Blob([texto],{type:'text/plain;charset=utf-8'})})}catch(_){try{await navigator.clipboard.writeText(texto)}catch(__){}}}
const TABS=['marca','reels','mensajes','plan','crecer'];
function show(t){if(!TABS.includes(t))t='plan';$('main').innerHTML=`<div class="tabp">${V[t]()}</div>`;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));if(location.hash!=='#'+t)history.replaceState(null,'','#'+t)}
$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.t)});
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
$('main').addEventListener('change',e=>{const c=e.target.closest('[data-pro]');if(!c)return;PS[c.dataset.pro]=c.checked;try{localStorage.setItem('munozPro',JSON.stringify(PS))}catch(_){}
  if(window._db)window._db.doc('pro/estado').set(PS).catch(()=>{});show('crecer')});
$('main').addEventListener('click',async e=>{
  const f=e.target.closest('#rf button');if(f){RF=f.dataset.k;show('reels');return}
  const g=e.target.closest('#mf button');if(g){MF=g.dataset.k;show('mensajes');return}
  const dl1=e.target.closest('[data-dlm]');if(dl1){const m=M[+dl1.dataset.dlm];bajarTxt(m[1],m[2]);return}
  const da=e.target.closest('[data-dlall]');if(da){const L=M.filter(m=>MF==='todos'||m[0]===MF);bajarTxt('Mensajes Muñoz - '+MCAT[MF],L.map(m=>'=== '+m[1]+' ===\n\n'+m[2]).join('\n\n\n'));return}
  const c=e.target.closest('[data-cp]');if(c){try{await navigator.clipboard.writeText(M[+c.dataset.cp][2]);c.textContent='¡Copiado!';setTimeout(()=>c.textContent='Copiar',1500)}catch(_){c.textContent='Seleccioná y copiá'}return}
  const d=e.target.closest('[data-dl]');if(d){const st=$('dlst');try{const dl=await claude.use('downloads');if(!dl)throw 0;d.textContent='Preparando…';const r=await fetch('media/'+d.dataset.dl);const blob=await r.blob();await dl.save({filename:d.dataset.dl,data:blob});d.textContent='Descargar'}catch(_){d.textContent='Descargar';st.textContent='Si la descarga no arranca, tocá el video y usá los tres puntitos → Descargar.'}}
});
show(location.hash.slice(1)||'plan');

const days=Object.keys(A);
const pad=n=>String(n).padStart(2,'0');
const now=new Date();const todayISO=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const DN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const lab=iso=>{const [y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d);return `${DN[dt.getDay()]} ${d}/${m}`};
let S={};let db=null;let open=new Set([days.includes(todayISO)?todayISO:days[0]]);
try{S=JSON.parse(localStorage.getItem('munozAgenda')||'{}')}catch(_){}
const get=d=>S[d]||(S[d]={done:[],note:'',extra:[]});
function item(d,i,txt){const s=get(d);const ok=s.done.includes(i);return `<label class="it ${ok?'ok':''}"><input type="checkbox" data-d="${d}" data-i="${i}" ${ok?'checked':''}><span>${esc(txt)}</span></label>`}

function fotoBox(t){const n=nextISO(t),n2=nextISO(n);const parts=[];
  if(FOTOS[t])parts.push(`<div style="margin-top:10px;color:#fc6320;font-weight:700">📸 Fotos para la publicación de hoy</div>${FOTOS[t].map(x=>`<div>• ${esc(x)}</div>`).join('')}`);
  if(FOTOS[n])parts.push(`<div style="margin-top:10px;color:#fc6320;font-weight:700">📸 Sacá hoy para mañana (${lab(n)})</div>${FOTOS[n].map(x=>`<div>• ${esc(x)}</div>`).join('')}`);
  else if(FOTOS[n2])parts.push(`<div style="margin-top:10px;color:#fc6320;font-weight:700">📸 Para pasado mañana (${lab(n2)})</div>${FOTOS[n2].map(x=>`<div>• ${esc(x)}</div>`).join('')}`);
  return parts.join('')}
function renderAg(){
  const t=days.includes(todayISO)?todayISO:null;
  $('today').innerHTML=t?`<div class="d">Hoy · ${lab(t)}</div>${A[t].concat(get(t).extra).map((x,i)=>`<div>• ${esc(x)}</div>`).join('')}${fotoBox(t)}`:`<div class="d">${todayISO<days[0]?'Arranca el 23/11':'Programa cumplido'}</div><div>La libreta va del 23/11 al 3/1.</div>`;
  $('agenda').innerHTML=days.map(d=>{const s=get(d);const all=A[d].concat(s.extra);const n=s.done.length;const op=open.has(d);
    return `<div class="day ${n>=all.length&&all.length?'done':''} ${d===todayISO?'is-today':''}"><div class="dh" data-tg="${d}"><b>${lab(d)}</b><span class="cnt">${FOTOS[d]?'📸 ':''}${n}/${all.length} ${op?'▾':'▸'}</span></div>${op?`<div>${all.map((x,i)=>item(d,i,x)).join('')}${FOTOS[d]?`<div class="fotos"><b>📸 Fotos que hacen falta</b>${FOTOS[d].map(x=>`<div>• ${esc(x)}</div>`).join('')}</div>`:''}<div class="addrow"><input type="text" placeholder="Agregar tarea" data-add="${d}" aria-label="Agregar tarea al ${lab(d)}"><button class="btn" data-addb="${d}">+</button></div><textarea data-note="${d}" placeholder="Notas: qué se hizo, consultas, resultados…">${esc(s.note)}</textarea></div>`:''}</div>`}).join('');
}
let tm=null;
function save(d){try{localStorage.setItem('munozAgenda',JSON.stringify(S))}catch(_){}
  if(db&&d){clearTimeout(tm);const v=get(d);tm=setTimeout(()=>{db.doc('agenda/'+d).set(v).then(()=>$('st').textContent='Guardado en la nube ✓').catch(e=>$('st').textContent='No se pudo guardar en la nube ('+(e&&e.message||'error')+'); queda en este navegador.')},500)}}
const ag=$('agenda');
ag.addEventListener('click',e=>{const t=e.target.closest('[data-tg]');if(t){const d=t.dataset.tg;open.has(d)?open.delete(d):open.add(d);renderAg();return}
  const b=e.target.closest('[data-addb]');if(b){const d=b.dataset.addb;const inp=ag.querySelector(`[data-add="${d}"]`);const v=inp.value.trim();if(v){get(d).extra.push(v);save(d);renderAg()}}});
ag.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.add){e.preventDefault();const d=e.target.dataset.add;const v=e.target.value.trim();if(v){get(d).extra.push(v);save(d);renderAg()}}});
ag.addEventListener('change',e=>{const c=e.target;if(c.type!=='checkbox')return;const s=get(c.dataset.d),i=+c.dataset.i;s.done=c.checked?[...new Set([...s.done,i])]:s.done.filter(x=>x!==i);save(c.dataset.d);renderAg()});
ag.addEventListener('input',e=>{const n=e.target.dataset.note;if(n){get(n).note=e.target.value;save(n)}});
renderAg();
(async()=>{try{const d=await claude.use('db');if(!d)return;db=d;window._db=d;$('st').textContent='Conectando con la nube…';
  db.doc('pro/estado').onSnapshot(x=>{const v=x&&x.data&&x.data();if(v){PS=v;if(location.hash==='#crecer')show('crecer')}},()=>{});
  const to=setTimeout(()=>{$('st').textContent='Guardando en este navegador.'},10000);
  db.collection('agenda').onSnapshot(snap=>{clearTimeout(to);snap.docs.forEach(x=>{const v=x.data();S[x.id]={done:v.done||[],note:v.note||'',extra:v.extra||[]}});
    if(!document.activeElement||!document.activeElement.dataset||!document.activeElement.dataset.note)renderAg();$('st').textContent='Guardado en la nube: lo ven todos los que tienen el link ✓'},e=>{$('st').textContent='No se pudo conectar con la planilla ('+(e&&e.message||'error')+'). Se guarda en este navegador.'})}catch(_){}})();
}
